  </g>
  <g fill="#ffffff">
    <rect x="28" y="28" width="26" height="26" rx="2"/>
    <rect x="186" y="28" width="26" height="26" rx="2"/>
    <rect x="28" y="186" width="26" height="26" rx="2"/>
  </g>
  <g fill="#1140fe">
    <rect x="34" y="34" width="14" height="14" rx="1"/>
    <rect x="192" y="34" width="14" height="14" rx="1"/>
