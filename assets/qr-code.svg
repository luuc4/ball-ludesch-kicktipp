<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="QR-Code Platzhalter">
  <rect width="240" height="240" fill="#ffffff"/>
  <rect x="8" y="8" width="224" height="224" fill="none" stroke="#1140fe" stroke-width="2" stroke-dasharray="6 6" rx="8"/>
  <!-- finder patterns (decorative) -->
  <g fill="#1140fe">
    <rect x="20" y="20" width="42" height="42" rx="4"/>
    <rect x="178" y="20" width="42" height="42" rx="4"/>
